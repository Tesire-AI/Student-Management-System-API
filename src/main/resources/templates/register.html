<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Registration</title>
</head>
<body>

<div>
    <h1>Student Registration</h1>
    <form th:action="@{/student/register}"
        th:object="${student}"
        method="post">

        <div>
            <label for="firstName">First Name</label>
            <input type ="text"
            id="firstName"
            th:field="*{firstName}"
            required/>
        </div>
        <div>
            <label for="lastName">Last Name</label>
            <input type ="text"
                   id="lastName"
                   th:field="*{lastName}"
                   required/>
        </div>
        <div>
            <label for="email">Email</label>
            <input type ="email"
                   id="email"
                   th:field="*{email}"
                   required/>
        </div>

        <div>
            <label for="age">Age</label>
            <input type ="number"
                   id="age"
                   min="1"
                   th:field="*{age}"
                   required/>
        </div>
            <button type="submit">Register</button>
    </form>
    <a th:href="@{/student/all}">View all students</a>
</div>
</body>
</html>
